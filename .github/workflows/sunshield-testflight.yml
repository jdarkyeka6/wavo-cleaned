name: Sun Shield to TestFlight

# Triggered for SunShield V0.3 explanatory results update.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/sunshield-testflight.yml

permissions:
  contents: read

concurrency:
  group: sunshield-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out Sun Shield
        uses: actions/checkout@v4
        with:
          repository: jdarkyeka6/SunShield
          ref: main
          path: sunshield

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          fi
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: sunshield
        run: npm install

      - name: Build and sync iOS app
        working-directory: sunshield
        run: npm run ios:sync

      - name: Install TestFlight lane
        working-directory: sunshield
        run: |
          mkdir -p ios/App/fastlane
          cp ios-ci/Gemfile ios/App/Gemfile
          cp ios-ci/Fastfile ios/App/fastlane/Fastfile

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: sunshield/ios/App

      - name: Build, sign and upload Sun Shield
        working-directory: sunshield/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane beta
