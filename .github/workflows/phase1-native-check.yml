name: Phase 1 Native Check
on:
  push:
    branches:
      - wavo-next-phase-1
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wavo-next-phase-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire Live Activity into native project
        run: |
          gem install xcodeproj --no-document
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/App/App/AppDelegate.swift')
          s = p.read_text()
          old = '        bridge?.registerPluginInstance(WavoCallKitPlugin.shared)\n'
          new = old + '        bridge?.registerPluginInstance(WavoLiveActivityPlugin.shared)\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('Could not find Capacitor plugin registration point')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          /usr/libexec/PlistBuddy -c 'Add :NSSupportsLiveActivities bool true' ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :NSSupportsLiveActivities true' ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSSupportsLiveActivitiesFrequentUpdates bool true' ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :NSSupportsLiveActivitiesFrequentUpdates true' ios/App/App/Info.plist
          ruby <<'RUBY'
          require 'xcodeproj'
          path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(path)
          main = project.targets.find { |t| t.name == 'App' }
          abort('App target missing') unless main

          group = project.main_group.find_subpath('WavoLiveActivity', true)
          group.set_source_tree('<group>')
          ref_for = lambda do |name|
            group.files.find { |f| f.path == name } || group.new_file(name)
          end
          attrs = ref_for.call('WavoActivityAttributes.swift')
          plugin = ref_for.call('WavoLiveActivityPlugin.swift')
          widget = ref_for.call('WavoLiveActivityWidget.swift')
          bundle = ref_for.call('WavoLiveActivityBundle.swift')
          ref_for.call('Info.plist')

          add_source = lambda do |target, ref|
            unless target.source_build_phase.files_references.include?(ref)
              target.source_build_phase.add_file_reference(ref, true)
            end
          end
          add_source.call(main, attrs)
          add_source.call(main, plugin)

          ext = project.targets.find { |t| t.name == 'WavoLiveActivity' }
          unless ext
            ext = project.new_target(:app_extension, 'WavoLiveActivity', :ios, '16.1')
            main.add_dependency(ext)
          end
          add_source.call(ext, attrs)
          add_source.call(ext, widget)
          add_source.call(ext, bundle)

          ext.build_configurations.each do |config|
            config.build_settings['APPLICATION_EXTENSION_API_ONLY'] = 'YES'
            config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
            config.build_settings['CURRENT_PROJECT_VERSION'] = '1'
            config.build_settings['GENERATE_INFOPLIST_FILE'] = 'NO'
            config.build_settings['INFOPLIST_FILE'] = 'WavoLiveActivity/Info.plist'
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.1'
            config.build_settings['MARKETING_VERSION'] = '1.0'
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'lol.wavo.app.WavoLiveActivity'
            config.build_settings['PRODUCT_NAME'] = '$(TARGET_NAME)'
            config.build_settings['SKIP_INSTALL'] = 'YES'
            config.build_settings['SWIFT_VERSION'] = '5.0'
            config.build_settings['TARGETED_DEVICE_FAMILY'] = '1,2'
          end

          embed = main.build_phases.find { |phase| phase.respond_to?(:name) && phase.name == 'Embed App Extensions' }
          unless embed
            embed = project.new(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase)
            embed.name = 'Embed App Extensions'
            embed.dst_subfolder_spec = '13'
            main.build_phases << embed
          end
          unless embed.files_references.include?(ext.product_reference)
            build_file = embed.add_file_reference(ext.product_reference, true)
            build_file.settings = { 'ATTRIBUTES' => ['RemoveHeadersOnCopy'] } if build_file
          end

          attrs_hash = project.root_object.attributes['TargetAttributes'] ||= {}
          attrs_hash[ext.uuid] ||= { 'CreatedOnToolsVersion' => '16.0' }
          project.save
          RUBY
      - name: Install dependencies and build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
        run: |
          npm install
          npm run build
          npx cap sync ios
      - name: Compile iOS app and Live Activity extension
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Commit native project wiring
        run: |
          if git diff --quiet; then
            echo 'Native project already wired.'
            exit 0
          fi
          git config user.name 'Wavo Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ios/App/App/AppDelegate.swift ios/App/App/Info.plist ios/App/App.xcodeproj/project.pbxproj package-lock.json
          git commit -m 'Wire Live Activity extension into iOS project'
          git push origin HEAD:wavo-next-phase-1
