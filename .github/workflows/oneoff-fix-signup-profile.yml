name: One-off signup profile fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-fix-signup-profile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch signup profile write
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()

          old = '''        const { error: profileErr } = await supabase.from("profiles").insert({
          id: data.user.id,
          username: auth.username.trim(),
          first_name: auth.firstName.trim(),
          last_name: auth.lastName.trim(),
          email: auth.email.trim(),
          birthday: auth.birthday,
          age: ageFromBirthday(auth.birthday),
        });'''

          new = '''        const { error: profileErr } = await supabase.from("profiles").upsert(
          {
            id: data.user.id,
            username: auth.username.trim(),
            first_name: auth.firstName.trim(),
            last_name: auth.lastName.trim(),
            email: auth.email.trim(),
            birthday: auth.birthday,
            age: ageFromBirthday(auth.birthday),
          },
          { onConflict: "id" }
        );'''

          if old not in text:
              raise SystemExit('Expected signup profile insert block was not found; refusing to patch.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit signup fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: avoid duplicate profile insert on signup"
          git push
