name: Waves build check
on:
  push:
    branches: [waves-review-empty-feed-fix]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/wavesRecommendations.test.mjs
      - run: npm run build
