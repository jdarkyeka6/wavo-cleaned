name: Waves mega bundle import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/waves-import.yml'
  workflow_dispatch:

jobs:
  import-waves:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Advance recursive import until complete
        shell: bash
        run: |
          set -euo pipefail
          URL='https://wavowaves.lol/api/waves-import-run?pages=30'
          for i in $(seq 1 120); do
            echo "Import pass $i"
            BODY="$(curl --fail --silent --show-error --max-time 70 "$URL")"
            echo "$BODY"
            COMPLETE="$(python3 -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("complete"))).lower())' <<<"$BODY")"
            if [ "$COMPLETE" = "true" ]; then
              echo "Waves import complete."
              exit 0
            fi
            sleep 2
          done
          echo "Import did not complete within the workflow limit." >&2
          exit 1
