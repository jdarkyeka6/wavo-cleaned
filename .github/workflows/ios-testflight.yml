name: iOS to TestFlight
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/testflight-trigger
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            echo "Xcode_26.3 not on this runner; using the default:"
            ls -d /Applications/Xcode*.app || true
          fi
          xcodebuild -version
      - name: Validate final App Store icon
        run: |
          set -euo pipefail
          icon="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          test -f "$icon" || { echo "::error::Missing final app icon: $icon"; exit 1; }
          width=$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')
          height=$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')
          if [ "$width" != "1024" ] || [ "$height" != "1024" ]; then
            echo "::error::App icon must be 1024x1024: $icon is ${width}x${height}"
            exit 1
          fi
          echo "Final primary App Store icon is present and 1024x1024."
      - name: Validate App Review account controls
        run: |
          set -euo pipefail
          grep -q "AccountDeletion" src/main.jsx || { echo "::error::Account deletion UI is not mounted"; exit 1; }
          grep -q "functions.invoke('delete-account'" src/AccountDeletion.jsx || { echo "::error::Account deletion UI is not wired to the server deletion flow"; exit 1; }
          grep -q "Delete your account" public/privacy.html || { echo "::error::Privacy policy does not document account deletion"; exit 1; }
          grep -q "Privacy Policy" src/ProfileSupportEnhancement.jsx || { echo "::error::Signed-in app has no direct Privacy Policy control"; exit 1; }
          grep -q "terms.html" src/ProfileSupportEnhancement.jsx || { echo "::error::Signed-in app has no direct Terms control"; exit 1; }
          grep -q "at least equivalent" public/privacy.html || { echo "::error::Privacy policy is missing service-provider protection language"; exit 1; }
          test -f docs/APP_REVIEW_BUILD_38.md || { echo "::error::Build 38 App Review notes are missing"; exit 1; }
          test -f supabase/functions/delete-account/index.ts || { echo "::error::delete-account Edge Function source is missing"; exit 1; }
          echo "App Review account, privacy and legal requirements are present in the release source."
      - name: Validate free-only native business model
        run: |
          set -euo pipefail
          grep -q "canUsePaidFeatures" src/main.jsx || { echo "::error::Native paid-feature mount guard is missing"; exit 1; }
          grep -q "if (!canUsePaidFeatures()) return 'free'" src/premiumProData.js || { echo "::error::Native paid-tier guard is missing"; exit 1; }
          grep -q "submitted iOS app is free-only" docs/APP_REVIEW_BUILD_38.md || { echo "::error::Review notes do not describe the free-only iOS business model"; exit 1; }
          grep -q "is free-only:" public/terms.html || { echo "::error::Terms do not describe the free-only iOS business model"; exit 1; }
          echo "Native App Store build is guarded as free-only."
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm install
      - name: Check the app config is present
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi
          echo "Supabase config present."
      - name: Build the current Wavo source
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
        run: npm run build
      - name: Verify the bundle carries the config
        run: |
          if ! grep -rq "supabase.co" dist/assets/*.js; then
            echo "::error::Built bundle contains no Supabase URL - the app would black-screen."
            exit 1
          fi
          echo "Bundle contains the Supabase URL."
      - name: Sync web build into iOS
        run: npx cap sync ios
      - name: iPad simulator smoke test
        run: |
          set -euo pipefail

          echo "Available iPad simulators:"
          xcrun simctl list devices available | grep "iPad" || true

          IPAD_UDID=$(xcrun simctl list devices available | grep "iPad" | grep -Eo '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -n 1)
          if [ -z "$IPAD_UDID" ]; then
            echo "::error::No available iPad simulator was found on the macOS runner."
            exit 1
          fi

          echo "Using iPad simulator $IPAD_UDID"
          xcrun simctl boot "$IPAD_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$IPAD_UDID" -b

          DERIVED_DATA="$RUNNER_TEMP/wavo-ipad-derived"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$IPAD_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH" || { echo "::error::Simulator app was not produced at $APP_PATH"; exit 1; }

          xcrun simctl install "$IPAD_UDID" "$APP_PATH"
          xcrun simctl launch "$IPAD_UDID" lol.wavo.app
          sleep 8

          mkdir -p artifacts
          xcrun simctl io "$IPAD_UDID" screenshot artifacts/wavo-ipad-launch.png
          echo "Wavo built, installed and launched on an iPad simulator."
      - name: Upload iPad smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wavo-ipad-smoke-test
          path: artifacts/wavo-ipad-launch.png
          if-no-files-found: warn
          retention-days: 14
      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/App
      - name: Bundle and validate iOS privacy manifest
        working-directory: ios/App
        run: |
          plutil -lint App/PrivacyInfo.xcprivacy
          bundle exec ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('App.xcodeproj')
          target = project.targets.find { |candidate| candidate.name == 'App' }
          abort('App target missing') unless target
          group = project.main_group.find_subpath('App', false)
          abort('App group missing') unless group
          ref = group.files.find { |file| file.path == 'PrivacyInfo.xcprivacy' } || group.new_file('PrivacyInfo.xcprivacy')
          unless target.resources_build_phase.files_references.include?(ref)
            target.resources_build_phase.add_file_reference(ref, true)
          end
          target.build_configurations.each do |config|
            config.build_settings.delete('ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES')
            config.build_settings['ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS'] = 'NO'
          end
          project.save
          RUBY
      - name: Build and upload to TestFlight
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane beta
