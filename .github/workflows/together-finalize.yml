name: Finalize Wavo Together
on:
  push:
    branches:
      - wavo-together-all
permissions:
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wavo-together-all
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final source patches
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/WavoTogether.jsx')
          s = p.read_text()
          old = "const weekCalls = (snapshot?.calls || []).filter((call) => call.status === 'ended')"
          new = "const weekCalls = (snapshot?.calls || []).filter((call) => call.status === 'ended').length"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not locate Together recap call count')
          p.write_text(s)

          p = Path('src/ChatMotionCalls.js')
          s = p.read_text()
          replacements = [
              (
                  "  const startCallRef = useRef(null)\n",
                  "  const startCallRef = useRef(null)\n  const reconnectTimerRef = useRef(null)\n",
              ),
              (
                  "  function resetPeerOnly() {\n    if (signalChannelRef.current) {",
                  "  function resetPeerOnly() {\n    if (reconnectTimerRef.current) {\n      window.clearTimeout(reconnectTimerRef.current)\n      reconnectTimerRef.current = null\n    }\n    if (signalChannelRef.current) {",
              ),
              (
                  "    pc.onconnectionstatechange = () => {\n      if (pc.connectionState === 'connected') setPhase('active')\n      if (['failed', 'disconnected'].includes(pc.connectionState)) setPhase('reconnecting')\n      if (pc.connectionState === 'closed') setRemoteReady(false)\n    }",
                  "    pc.onconnectionstatechange = () => {\n      if (pc.connectionState === 'connected') {\n        if (reconnectTimerRef.current) {\n          window.clearTimeout(reconnectTimerRef.current)\n          reconnectTimerRef.current = null\n        }\n        setPhase('active')\n      }\n      if (['failed', 'disconnected'].includes(pc.connectionState)) {\n        setPhase('reconnecting')\n        if (activeCallRef.current?.role === 'caller' && !reconnectTimerRef.current) {\n          reconnectTimerRef.current = window.setTimeout(async () => {\n            reconnectTimerRef.current = null\n            if (peerRef.current !== pc || pc.connectionState === 'connected' || pc.signalingState !== 'stable') return\n            try {\n              pc.restartIce?.()\n              await sendOffer(callId, true)\n            } catch (err) {\n              console.warn('[wavo calls] ICE restart failed', err)\n            }\n          }, 1200)\n        }\n      }\n      if (pc.connectionState === 'closed') setRemoteReady(false)\n    }",
              ),
              (
                  "  async function sendOffer(callId) {\n    if (offerSentRef.current) return\n    const pc = createPeerConnection(callId)\n    const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true })",
                  "  async function sendOffer(callId, iceRestart = false) {\n    if (offerSentRef.current && !iceRestart) return\n    const pc = createPeerConnection(callId)\n    const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true, iceRestart })",
              ),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit('Could not locate a ChatMotionCalls reconnect patch target')
          p.write_text(s)
          PY
      - run: npm install
      - name: Build Wavo with Together
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
        run: npm run build
      - name: Commit patches when needed
        run: |
          if git diff --quiet; then
            echo "Final patches already committed."
            exit 0
          fi
          git config user.name "Wavo Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/WavoTogether.jsx src/ChatMotionCalls.js package-lock.json
          git commit -m "Finish Together recap and call recovery"
          git push origin HEAD:wavo-together-all
