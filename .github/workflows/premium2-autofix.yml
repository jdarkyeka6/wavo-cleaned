name: Premium 2 Autofix
on:
  push:
    branches:
      - wavo-premium-2-pro
    paths:
      - .github/premium2-autofix-trigger
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wavo-premium-2-pro
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch release source and create alternate icons
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, math, struct, zlib

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected source not found in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new))

          p = Path('src/PremiumProEnhancement.jsx')
          s = p.read_text()
          old = """    const username = dm.querySelector('.chat-topbar strong')?.textContent?.trim()\n    if (!username) return null\n    const { data: friend } = await supabase.from('profiles').select('id,username').eq('username', username).maybeSingle()"""
          new = """    const canonical = [...dm.querySelectorAll('.chat-topbar span')]\n      .map((node) => node.textContent?.trim() || '')\n      .find((value) => value.startsWith('@'))\n    const username = (canonical ? canonical.slice(1) : dm.querySelector('.chat-topbar strong')?.textContent?.trim()) || ''\n    if (!username) return null\n    const { data: friend } = await supabase.from('profiles').select('id,username').ilike('username', username).limit(1).maybeSingle()"""
          if old not in s: raise SystemExit('DM resolver source changed')
          s = s.replace(old, new)
          s = s.replace(".select('id,name,creator_id').eq('name', name).limit(1).maybeSingle()", ".select('id,name,created_by').eq('name', name).limit(1).maybeSingle()")
          s = s.replace("creatorId: group.creator_id", "creatorId: group.created_by")
          s = s.replace("const premiumPrice = priceFor(products, APPLE_PRODUCTS.premium, 'A$4.99/month')\n  const proPrice = priceFor(products, APPLE_PRODUCTS.pro, 'A$14.99/month')", "const premiumProduct = products.find((item) => item.identifier === APPLE_PRODUCTS.premium)\n  const proProduct = products.find((item) => item.identifier === APPLE_PRODUCTS.pro)\n  const premiumPrice = premiumProduct?.priceString || (native ? 'Loading from App Store…' : 'A$4.99/month')\n  const proPrice = proProduct?.priceString || (native ? 'Loading from App Store…' : 'A$14.99/month')")
          old_buy = """    try {\n      if (native) await purchaseAppleTier(wanted, userId)\n      else await startWebCheckout(wanted === 'pro' ? 'pro' : 'standard')"""
          new_buy = """    try {\n      if (native && !products.find((item) => item.identifier === APPLE_PRODUCTS[wanted])) {\n        throw new Error('Subscriptions are still loading from the App Store. Try again in a moment.')\n      }\n      if (native) await purchaseAppleTier(wanted, userId)\n      else await startWebCheckout(wanted === 'pro' ? 'pro' : 'standard')"""
          if old_buy not in s: raise SystemExit('Purchase source changed')
          s = s.replace(old_buy, new_buy)
          p.write_text(s)

          p = Path('src/MobileUX.jsx')
          s = p.read_text()
          old = 'const payload = { reporter_id: me, message_id: message.id, reason: reason.trim() };'
          new = 'const payload = { reporter_id: me, reason: reason.trim(), ...(kind === "dm" ? { message_id: message.id } : { group_message_id: message.id }) };'
          if old not in s: raise SystemExit('Report message source changed')
          p.write_text(s.replace(old, new))

          # Generate four distinct 1024px alternate icons without needing image dependencies.
          base = Path('ios/App/App/Assets.xcassets')
          variants = {
              'OceanIcon': ((38,104,255),(42,206,230)),
              'MidnightIcon': ((20,18,50),(66,50,130)),
              'NeonIcon': ((84,36,210),(34,220,230)),
              'RoseIcon': ((210,54,142),(255,112,145)),
          }
          bolt = [(365,252),(691,252),(562,433),(763,433),(511,771),(511,610),(347,610),(446,472),(244,472)]
          def inside(x,y,poly):
              c=False
              j=len(poly)-1
              for i in range(len(poly)):
                  xi,yi=poly[i]; xj,yj=poly[j]
                  if ((yi>y)!=(yj>y)) and x < (xj-xi)*(y-yi)/(yj-yi+1e-9)+xi: c=not c
                  j=i
              return c
          def chunk(kind,data):
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
          def write_png(path,c0,c1):
              rows=[]
              for y in range(1024):
                  t=y/1023
                  row=bytearray([0])
                  for x in range(1024):
                      u=(x+y)/(2046)
                      r=int(c0[0]*(1-u)+c1[0]*u); g=int(c0[1]*(1-u)+c1[1]*u); b=int(c0[2]*(1-u)+c1[2]*u)
                      # soft highlight in top-left
                      d=((x-250)**2+(y-220)**2)**0.5
                      lift=max(0,1-d/650)*22
                      r=min(255,int(r+lift)); g=min(255,int(g+lift)); b=min(255,int(b+lift))
                      if inside(x+.5,y+.5,bolt): r=g=b=255
                      row.extend((r,g,b))
                  rows.append(bytes(row))
              raw=b''.join(rows)
              png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',1024,1024,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              path.write_bytes(png)
          contents = {"images":[{"filename":"Icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          for name,(c0,c1) in variants.items():
              folder=base/f'{name}.appiconset'; folder.mkdir(parents=True,exist_ok=True)
              (folder/'Contents.json').write_text(json.dumps(contents,indent=2)+"\n")
              write_png(folder/'Icon-1024.png',c0,c1)

          # Server verification moved to Supabase Edge Functions, so the Vercel verifier/dependency is redundant.
          api = Path('api/apple-entitlement.js')
          if api.exists(): api.unlink()
          pkg = json.loads(Path('package.json').read_text())
          pkg.get('dependencies',{}).pop('@apple/app-store-server-library',None)
          Path('package.json').write_text(json.dumps(pkg,indent=2)+"\n")
          PY
      - name: Refresh npm lockfile
        run: npm install --package-lock-only
      - name: Commit release fixes
        run: |
          git config user.name "Wavo Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Finish Premium 2 release wiring"
          git push origin HEAD:wavo-premium-2-pro
