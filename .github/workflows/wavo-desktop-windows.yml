name: Wavo Windows installer

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/wavo-desktop-windows.yml'
  workflow_dispatch:
  push:
    tags:
      - 'wavo-desktop-v*'

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/wavo-desktop-v') && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/wavo-desktop-v') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Upload installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: Wavo-Windows-Setup
          path: |
            desktop/dist/Wavo-Setup.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/wavo-desktop-v')
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Wavo-Windows-Setup
          path: release
      - name: Draft release for testing and approval
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Wavo-Setup.exe
            release/latest.yml
            release/*.blockmap
          generate_release_notes: true
          draft: true
