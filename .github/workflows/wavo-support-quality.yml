name: Wavo Support AI quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit tests for support retrieval, context and model selection
        run: node --test tests/wavoSupportAi.test.mjs
      - name: Front-end build
        run: npm run build
      - name: Edge Function TypeScript validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Support Edge Function and helpers
        run: deno check supabase/functions/support-ai/index.ts
