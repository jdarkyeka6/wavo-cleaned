name: Wavo Support AI quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit tests for support retrieval, context and model selection
        run: node --test tests/wavoSupportAi.test.mjs
      - name: Dry-run synthetic model evaluation (no API calls)
        run: node scripts/evaluate-wavo-support.mjs
      - name: Front-end build
        run: npm run build
      - name: Check TestFlight signing lane syntax and safe recovery
        run: |
          ruby -c ios/App/fastlane/Fastfile
          if grep -Fq 'oldest.delete!' ios/App/fastlane/Fastfile; then
            echo "::error::Automatic Apple certificate revocation is unsafe"
            exit 1
          fi
      - name: Edge Function TypeScript validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Support Edge Function and helpers
        run: deno check --node-modules-dir=auto supabase/functions/support-ai/index.ts
      - name: Exercise full HTTP handler with fake Supabase and OpenAI
        run: deno test --no-check tests/wavoSupportHandler.test.ts
      - name: Report Support TestFlight candidate status
        if: github.head_ref == 'feature/wavo-support-smart-20261023'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios-testflight.yml/runs?branch=feature%2Fwavo-support-smart-20261023&per_page=5" \
            --jq '.workflow_runs[] | [.id, .event, .status, (.conclusion // "pending"), .head_sha, .html_url] | @tsv'
      - name: Report Apple certificate inventory workflow status
        if: github.head_ref == 'feature/wavo-support-smart-20261023'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios-signing-audit.yml/runs?branch=feature%2Fwavo-support-smart-20261023&per_page=5" \
            --jq '.workflow_runs[] | [.id, .event, .status, (.conclusion // "pending"), .head_sha, .html_url] | @tsv'


