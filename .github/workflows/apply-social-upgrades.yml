name: Apply Wavo social upgrades

on:
  push:
    branches:
      - feature/wavo-social-upgrades
    paths:
      - .github/workflows/apply-social-upgrades.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded App.jsx patch
        run: python scripts/apply_social_upgrades.py

      - name: Verify production build
        run: npm run build

      - name: Commit integrated App.jsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && { echo "No integration changes to commit"; exit 0; }
          git commit -m "feat: integrate profiles roles pins streaks and media viewer"
          git push origin HEAD:${GITHUB_REF_NAME}
